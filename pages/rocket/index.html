<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,    user-scalable=no, maximum-scale=1, minimum-scale=1">
    <link rel="icon" href="../../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="main.css">
    <title>火箭发射模拟</title>
    <script>
        var _hmt = _hmt || [];
        (function() {
          var hm = document.createElement("script");
          hm.src = "https://hm.baidu.com/hm.js?c6a16e7744f5e96b195b98f5a2818207";
          var s = document.getElementsByTagName("script")[0]; 
          s.parentNode.insertBefore(hm, s);
        })();
    </script>
</head>
<body class="main unselectable">
    <audio id="audioDom" src="time.mp3"></audio>
    <div id="main">
        <h1 id="count">20</h1>
        <div class="rocketBox">
            <div class="location">酒泉卫星发射中心</div>
            <div class="line" id="line1"></div><div class="line" id="line2"></div><div class="line" id="line3"></div><div class="line" id="line4"></div><div class="line" id="line5"></div><div class="line" id="line6"></div>
            <div class="taoyitaBox">
                <div><div class="taoyita_1"></div></div><div><div class="taoyita_2"></div></div><div><div class="taoyita_3"></div></div>
            </div>
            <div class="part_1">
                <div class="top"></div><div class="zhengliuzhaoBox"><span id="red"></span><div class="zhengliuzhao_1"></div><div class="zhengliuzhao_2"></div></div>
                <div class="feichuanBox">
                    <div id="weixing">🛰️</div>
                </div>
            </div>
            <div class="part_2">
                <div><div class="second_1">如<br>意</div></div>
                <div><div class="second_2">中<br>国<br>航<br>天</div></div>
            </div>
            <div class="part_7" style="margin-top:1px;margin-left:65px;">
                <div><img class="fire" src="fire.gif" alt=""></div>
            </div>
            <div class="part_3">
                <div><div class="block_1">长<br>征<br>|<br>2<br>F</div></div>
                <div style="margin-top:-14px;"><div class="block_2"></div></div>
                <div class="part_6" style="margin-top:21px;">
                    <div><img class="fire" src="fire.gif" alt=""></div>
                </div>
                <div class="block_3">助推器</div>
                <div class="block_4">助推器</div>
                <div id="zhutui_line1"></div>
                <div id="zhutui_line2"></div>
                <img id="fire1" src="fire.gif" alt=""><img id="fire2" src="fire.gif" alt="">
            </div>
            <div class="part_5">
                <div><img class="fire" src="fire.gif" alt=""></div>
            </div>
            <div class="part_4">
                <div><div class="bottom_1"></div></div>
                <div style="margin-top:-17px;"><div class="bottom_2"></div></div>
                <div style="margin-top:-17px;"><div class="bottom_3"></div></div>
            </div>
            
        </div>
    </div>
    <div id='earth'>地球</div>
    <div id="startBtn">启动发射程序</div>
    <div id="process"></div>

    <div class="solarsys">
        <div class='sun'>地球</div>
      
        <!--轨道-->
        <div class='earthOrbit'></div>
      
        <!--卫星-->
        <div class='earth'>🛰️</div>
        <!-- <div class='earth2'></div> -->
      
        <!--轨道-->
        <div class='jupiterOrbit'></div>
      
        <!---->
        <div class='jupiter'>月球</div>
        <!--轨道-->
        <div class='marsOrbit'></div>

        <!---->
        <div class='mars'><img src="./kongjianzhan.png" alt=""></div>
      
      </div>
    <script src="main.js"></script>
</body>
</html>
