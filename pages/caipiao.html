<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <title>彩票选号辅助</title>

        #btn_2{

            margin-left:-130px;

<body>
    <span class="btn" id="btn_1">福彩大乐透</span>
    <span class="btn" id="btn_2">体彩大乐透</span>
    <script>
        document.getElementById("btn_1").onclick = function(){
            window.location.href = "./daletoufucai.html";
        }
        document.getElementById("btn_2").onclick = function(){
            window.location.href = "./daletouticai.html";
        }
    </script>
</body>
</html>
