<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,    user-scalable=no, maximum-scale=1, minimum-scale=1">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <title>停车场🅿️</title>
    <link rel="stylesheet" href="../css/parking.css">
</head>
<body class="unselectable">
    <div class="main">
        <div class="content">
            <div class="content_box">
                <div class="door">
                    <div class="house">🅿️</div>
                    <div class="block1_1"></div>
                    <div class="block1_2"></div>
                    <div class="block2_1"></div>
                    <div class="block2_2"></div>
                </div>
                <div class="parking parking_1">
                    <div class="car">🚗</div><div class="car">🚗</div><div class="car">空</div><div class="car">空</div><div class="car">🚗</div><div class="car">🚗</div>
                </div>
                <div class="parking parking_1">
                    <div class="car">🚗</div><div class="car">空</div><div class="car">🚗</div><div class="car">🚗</div><div class="car">空</div><div class="car">🚗</div>
                </div>
                <div class="parking parking_1">
                    <div class="car">🚗</div><div class="car">🚗</div><div class="car">空</div><div class="car">空</div><div class="car">🚗</div><div class="car">🚗</div>
                </div>
            </div>
            <div class="road_verti road_verti_road_3">⬇</div>
            <div class="road_verti road_verti_road_4">⬆</div>
            <div class="road_hori road_1"><span class="line"></span><span class="line"></span></div>
            <div class="road_hori road_4"><span class="line"></span><span class="line"></span><span class="line"></span></div>
        </div>

        <div class="screen">
            <marquee id="text" loop>欢迎您！剩余车位： 6 个</marquee>
        </div>
    <div class="scroll_car" id="car1">车</div>
    <div class="scroll_car" id="car2">车</div>
        <div class="btn_box">
            <button id="car_out" style="margin-right:36px;">出停车场</button>
            <button id="car_in">进停车场</button>
        </div>
    </div>
    <script src="../js/parking.js"></script>
</body>
</html>
